services:
  postgres:
    image: postgres:17
    container_name: forge-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_89
      POSTGRES_DB: forge

    ports:
      - "5432:5432"

    volumes:
      - forge_postgres_data:/var/lib/postgresql/data

volumes:
  forge_postgres_data:
